services:
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight_ui
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: url_shortener_rabbitmq
    restart: always
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api1:
    build: .
    container_name: url_shortener_api1
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:root@postgres:5432/url_shortener
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INSTANCE_NAME: api1
      MACHINE_ID: "1"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  api2:
    build: .
    container_name: url_shortener_api2
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:root@postgres:5432/url_shortener
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INSTANCE_NAME: api2
      MACHINE_ID: "2"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  analytics_worker:
    build: .
    container_name: url_shortener_worker
    restart: always
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:root@postgres:5432/url_shortener
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - postgres
      - rabbitmq

  nginx:
    image: nginx:alpine
    container_name: url_shortener_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  postgres_data:
  redis_data:
  redis_insight_data:
  rabbitmq_data:



