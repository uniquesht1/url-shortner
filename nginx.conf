events {
    worker_connections 1024;
}

http {
    upstream api_cluster {
        server api1:8000 max_fails=1 fail_timeout=5s;
        server api2:8000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fast failover when a container dies
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Pass through custom application headers
            proxy_pass_header X-Cache;
            proxy_pass_header X-Handled-By;
        }
    }
}
